; Background workers of the UMG platform (production).
; Install:  sudo cp deploy/supervisor/umg-scol.conf /etc/supervisor/conf.d/umg-scol.conf
;           (adapt APP_DIR below and the "user"), then:
;           sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start umg-scol:*
; After each deployment:  php artisan queue:restart   (workers finish their job, then reload the new code)
; Logs:     storage/logs/worker-*.log

[group:umg-scol]
programs=umg-scol-default,umg-scol-imports,umg-scol-scheduler

; OTP emails and other short jobs: several processes, a job retried 3 times.
[program:umg-scol-default]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/umg-scol
command=php artisan queue:work database --queue=default --sleep=1 --tries=3 --backoff=10 --timeout=60 --max-time=3600
numprocs=2
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/var/www/umg-scol/storage/logs/worker-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; Analysis and confirmation of large imports: one at a time, never replayed (all or nothing),
; 600 s at most (student_imports.job_timeout), below DB_QUEUE_RETRY_AFTER=660.
[program:umg-scol-imports]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/umg-scol
command=php artisan queue:work database --queue=imports --sleep=2 --tries=1 --timeout=600 --memory=1024 --max-time=3600
numprocs=1
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=660
redirect_stderr=true
stdout_logfile=/var/www/umg-scol/storage/logs/worker-imports.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; Scheduled tasks (import and OTP purges, trash cleanup, notifications). Instead of this program,
; a cron entry also works:  * * * * * cd /var/www/umg-scol && php artisan schedule:run >> /dev/null 2>&1
[program:umg-scol-scheduler]
directory=/var/www/umg-scol
command=php artisan schedule:work
numprocs=1
user=www-data
autostart=true
autorestart=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/www/umg-scol/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
