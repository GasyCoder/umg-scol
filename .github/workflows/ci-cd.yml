name: ci-cd

# Every push on master is tested, then deployed to production (o2switch) only when all checks pass.
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: umg_bourse
          MYSQL_USER: umg_bourse
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'

      - name: Setup Application
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: umg_bourse
          DB_USERNAME: umg_bourse
          DB_PASSWORD: ci-password
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    # One deployment at a time, never cancelled half-way.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'

      # The interface is built here: the host never runs npm. Dev dependencies are needed for the
      # build (Wayfinder), then removed so that only production packages are shipped.
      - name: Build release
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --ansi
          npm ci --no-audit --no-fund
          npm run build
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
          rm .env

      # o2switch only accepts SSH from whitelisted addresses: this runner's address is added for the
      # deployment and removed at the end, whatever the outcome.
      - name: Allow this runner through the SSH whitelist
        env:
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          RUNNER_IP="$(curl -fsS https://api.ipify.org)"
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          curl -fsS -H "Authorization: cpanel $DEPLOY_USER:$CPANEL_TOKEN" \
            "https://$CPANEL_HOST:2083/execute/SshWhitelist/add?address=$RUNNER_IP&port=22" \
            | jq -e '.status == 1' > /dev/null

      - name: Install the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  ConnectTimeout 10\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config

      - name: Wait for the SSH access
        run: |
          for attempt in $(seq 1 30); do
            ssh -o BatchMode=yes prod true && exit 0
            sleep 10
          done
          echo "SSH still refused after the whitelist update." && exit 1

      - name: Maintenance mode
        run: ssh prod "cd $DEPLOY_PATH && if [ -f artisan ]; then php artisan down --retry=30 || true; fi"

      # .env, storage and the server's caches are never touched (excluded, so never deleted either).
      - name: Upload release
        run: rsync -az --delete --exclude-from=deploy/o2switch/rsync-exclude.txt ./ "prod:$DEPLOY_PATH/"

      - name: Migrate, cache and restart workers
        run: ssh prod "cd $DEPLOY_PATH && bash deploy/o2switch/post-deploy.sh"

      - name: Back online if the deployment failed
        if: failure()
        run: ssh prod "cd $DEPLOY_PATH && if [ -f artisan ]; then php artisan up || true; fi"

      - name: Remove this runner from the SSH whitelist
        if: always() && env.RUNNER_IP != ''
        env:
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          cleanup_failed=0
          for direction in in out; do
            if ! curl -fsS -H "Authorization: cpanel $DEPLOY_USER:$CPANEL_TOKEN" \
              "https://$CPANEL_HOST:2083/execute/SshWhitelist/remove?address=$RUNNER_IP&port=22&direction=$direction" \
              | jq -e '.status == 1' > /dev/null; then
              echo "SSH whitelist cleanup failed for direction=$direction." >&2
              cleanup_failed=1
            fi
          done
          exit "$cleanup_failed"
